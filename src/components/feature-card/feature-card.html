<!-- Компонент: feature-card — карточка «В центре внимания». Параметры: href, tag, title, image -->
<a class="feature-card" href="{{href}}">
  <span class="feature-card__tag">{{tag}}</span>
  <div class="feature-card__image">
    <img src="{{image}}" alt="" width="1200" height="800" loading="lazy">
  </div>
  <h3 class="feature-card__title">{{title}}</h3>
</a>
