{{!-- Блок: hero-controls — панель управления слайдером первого экрана:
     полоска автопрокрутки, счётчик «01 — 02» и стрелки. --}}
<div class="hero-controls">
  <div class="hero-controls__progress"></div>
  <div class="hero-controls__counter"></div>
  <button class="button button--glass button--icon button--prev hero-controls__prev" type="button" aria-label="Предыдущий слайд"></button>
  <button class="button button--glass button--icon button--next hero-controls__next" type="button" aria-label="Следующий слайд"></button>
</div>
