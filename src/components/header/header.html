<!-- Блок: header — шапка с верхней строкой (радио, подкасты, поиск, слабовидящие)
     и нижней (логотип и меню). Медиа и поиск — отдельные блоки header-media и header-search. -->
<header class="header">
  <div class="container container-header">
    <!-- Верхняя строка: радио, подкасты, поиск, версия для слабовидящих -->
    <div class="header-top">
      {{> header-media}}

      {{> header-search}}

      <button class="header-top__action" type="button">
        <img src="/src/assets/icons/header/show.svg" alt="" width="24" height="24">
        Версия для слабовидящих
      </button>
    </div>

    <!-- Нижняя строка: логотип и меню -->
    <div class="header-bottom">
      <a class="header-bottom__logo" href="/" aria-label="Парки Москвы — на главную">
        <img src="/src/assets/images/header/logo-parki-moskvy.svg" alt="Парки Москвы" width="147" height="36">
      </a>
      {{> nav}}
    </div>
  </div>
</header>
