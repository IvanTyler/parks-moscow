<!-- Компонент: event-card — карточка события в сетке «Афиши».
     Параметры: href, image, park, title (можно с <br>), text, date, datetime, free.
     Теги передаются блочной вставкой: карточка выводит partial-block,
     а в месте вызова внутри блока перечисляются компоненты tag. -->
<article class="event-card">
  <a class="event-card__link" href="{{href}}">
    <div class="event-card__image">
      <img class="event-card__img" src="{{image}}" alt="" width="402" height="230" loading="lazy">
      {{#if free}}<span class="event-card__badge">Бесплатно</span>{{/if}}
    </div>
    <p class="event-card__park">{{park}}</p>
    <h3 class="event-card__title">{{{title}}}</h3>
    <p class="event-card__text">{{text}}</p>
    <time class="event-card__date" datetime="{{datetime}}">{{date}}</time>
    <div class="event-card__tags">{{> @partial-block}}</div>
  </a>
</article>
