<!-- Компонент: calendar — месяц, ряд дней и стрелка к следующим дням -->
<div class="calendar">
  <p class="calendar__month">Октябрь</p>
  <ul class="calendar__days">
    <li class="calendar__item"><button class="calendar__day" type="button"><span class="calendar__date">11</span><span class="calendar__weekday">пн</span></button></li>
    <li class="calendar__item"><button class="calendar__day" type="button"><span class="calendar__date">12</span><span class="calendar__weekday">вт</span></button></li>
    <li class="calendar__item"><button class="calendar__day" type="button"><span class="calendar__date">13</span><span class="calendar__weekday">ср</span></button></li>
    <li class="calendar__item"><button class="calendar__day" type="button"><span class="calendar__date">14</span><span class="calendar__weekday">чт</span></button></li>
    <li class="calendar__item"><button class="calendar__day" type="button"><span class="calendar__date">15</span><span class="calendar__weekday">пт</span></button></li>
    <li class="calendar__item"><button class="calendar__day" type="button"><span class="calendar__date">16</span><span class="calendar__weekday">сб</span></button></li>
    <li class="calendar__item"><button class="calendar__day" type="button"><span class="calendar__date">17</span><span class="calendar__weekday">вс</span></button></li>
    <li class="calendar__item"><button class="calendar__day" type="button"><span class="calendar__date">18</span><span class="calendar__weekday">пн</span></button></li>
    <li class="calendar__item"><button class="calendar__day" type="button"><span class="calendar__date">19</span><span class="calendar__weekday">вт</span></button></li>
    <li class="calendar__item"><button class="calendar__day" type="button"><span class="calendar__date">20</span><span class="calendar__weekday">ср</span></button></li>
    <li class="calendar__item"><button class="calendar__day" type="button"><span class="calendar__date">21</span><span class="calendar__weekday">чт</span></button></li>
    <li class="calendar__item"><button class="calendar__day" type="button"><span class="calendar__date">22</span><span class="calendar__weekday">пт</span></button></li>
    <li class="calendar__item"><button class="calendar__day" type="button"><span class="calendar__date">23</span><span class="calendar__weekday">сб</span></button></li>
    <li class="calendar__item"><button class="calendar__day" type="button"><span class="calendar__date">24</span><span class="calendar__weekday">вс</span></button></li>
  </ul>
  <button class="button button--icon calendar__next" type="button" aria-label="Следующие дни"></button>
</div>
